name: Contract

# Nightly check that the live SIDOF API still matches the schemas this package relies on.
# On failure it opens (or comments on) an issue labeled "contract".

on:
  schedule:
    - cron: "17 13 * * *" # 07:17 in Mexico City
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label contract --state open \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh label create contract --repo "$GITHUB_REPOSITORY" --color B60205 \
              --description "Live SIDOF API contract" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label contract \
              --title "SIDOF contract test failed" \
              --body "The nightly contract test against the live SIDOF API failed: $RUN_URL"
          fi
