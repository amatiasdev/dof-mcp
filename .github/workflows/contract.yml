name: Contract

# Nightly check that the live SIDOF API still matches the schemas this package relies on.
# On failure a separate job opens (or comments on) an issue labeled "contract".
#
# Two jobs on purpose: `live` runs third-party code (npm dependencies, vitest) with a read-only
# token, and `report` holds the only token that can write issues but checks out and installs
# nothing. Jobs run on separate machines, so code in `live` cannot reach `report`'s token.

on:
  schedule:
    - cron: "17 13 * * *" # 07:17 in Mexico City
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No shared npm cache: this job must not be able to seed one that other workflows restore.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:live

  report:
    needs: live
    # failure() is required: without a status function GitHub adds success() and the job would
    # never run. The result check keeps a cancelled `live` from opening an issue.
    if: failure() && needs.live.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the contract issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$REPO" --label contract --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Failed again: $RUN_URL"
          else
            gh label create contract --repo "$REPO" --force --color B60205 \
              --description "Live SIDOF API contract"
            gh issue create --repo "$REPO" --label contract \
              --title "SIDOF contract test failed" \
              --body "The nightly contract test against the live SIDOF API failed: $RUN_URL"
          fi
