name: Release

# Changesets flow with npm trusted publishing (OIDC, automatic provenance; no NPM_TOKEN).
# Pending changesets on main open a "Version Packages" PR; merging it publishes to npm,
# creates the GitHub release and publishes server.json to the MCP Registry. See RELEASING.md.

on:
  push:
    branches: [main]

permissions: {}

# Every job installs with --ignore-scripts: a compromised dependency must not run code in a job
# that can mint an npm OIDC token.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.sm.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.sm.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: sm
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Keeps src/version.ts, server.json and package-lock.json in step with package.json.
          script: npm run version-packages

  # Pull requests opened with GITHUB_TOKEN trigger no workflows, so the Version Packages PR
  # would go unchecked. workflow_dispatch is the exception GitHub allows: run CI and CodeQL on
  # its branch so the PR gets the same required checks as any other. This job checks out and
  # installs nothing; it can only start workflows.
  check-version-pr:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run CI and CodeQL on the Version Packages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref changeset-release/main
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref changeset-release/main

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    # Must match the environment configured in the npm trusted publisher.
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
      - name: Publish to the MCP Registry
        if: steps.publish.outputs.published == 'true'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          # npm metadata can lag a few seconds behind the publish the registry validates against.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1

  # Ships the released code to the hosted endpoint (see deploy-lambda.yml). The gate must not
  # read AWS_DEPLOY_ROLE_ARN: it lives in the `release` environment, which a job-level `if`
  # cannot see, so such a check is always empty and the deploy would never run.
  deploy-lambda:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/deploy-lambda.yml
    permissions:
      contents: read
      id-token: write
